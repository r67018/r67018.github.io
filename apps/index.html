<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HGQV18W8NC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HGQV18W8NC');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アプリ一覧 | Ryosei Goto</title>
  <meta name="description" content="アプリ一覧です。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/iceberg.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      min-height: 100vh;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    ::selection {
      background: var(--text);
      color: var(--bg);
    }

    .page {
      max-width: 880px;
      margin: 0 auto;
    }

    .home {
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .home:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 14px 0 22px;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .apps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .apps a {
      display: flex;
      flex-direction: column;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      overflow: hidden;
    }

    .apps a:hover {
      border-color: var(--accent);
    }

    .apps a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .apps > li {
      min-width: 0;
    }

    .thumb {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.75rem;
    }

    .thumb:not(:has(img))::before {
      content: "サムネイル";
    }

    .thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .text {
      padding: 14px 16px 16px;
    }

    .name {
      display: block;
      color: var(--accent);
      font-size: 1rem;
    }

    @media (min-width: 700px) {
      .apps {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.35rem;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="home" href="../">← Back</a>
    <h1>アプリ一覧</h1>

    <!-- 足し方は apps/README.md -->
    <ul class="apps">
      <li>
        <a href="./color/">
          <span class="thumb">
            <img src="./color/thumbnail.webp" alt="色相環パレットの画面" width="800" height="500" loading="lazy" decoding="async">
          </span>
          <span class="text">
            <span class="name">色相環パレット</span>
          </span>
        </a>
      </li>
    </ul>
  </div>
  <script src="../assets/js/snow.js" defer></script>
</body>
</html>
