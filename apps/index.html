<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HGQV18W8NC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HGQV18W8NC');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apps | Ryosei Goto</title>
  <meta name="description" content="作っている小さなツールの一覧です。">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #161821;
      --panel: #1e2132;
      --line: #34384c;
      --text: #c6c8d1;
      --muted: #6b7089;
      --accent: #89b8c2;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      min-height: 100vh;
      padding:
        max(20px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(28px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    ::selection {
      background: var(--text);
      color: var(--bg);
    }

    .page {
      max-width: 640px;
      margin: 0 auto;
    }

    .home {
      color: var(--accent);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .home:hover {
      text-decoration: underline;
    }

    h1 {
      margin: 14px 0 6px;
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .apps {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .apps a {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 44px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
    }

    .apps a:hover {
      border-color: var(--accent);
    }

    .apps a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .text {
      min-width: 0;
      flex: 1;
    }

    .name {
      display: block;
      color: var(--accent);
      font-size: 1rem;
    }

    .desc {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.6;
    }

    .arrow {
      color: var(--accent);
      flex: none;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.35rem;
      }

      .apps a {
        padding: 14px 14px;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <a class="home" href="../">← 戻る</a>
    <h1>Apps</h1>
    <p class="lead">作っている小さなツールです。</p>

    <!-- アプリを増やすときは、このリストに li を1つ足す -->
    <ul class="apps">
      <li>
        <a href="./color/">
          <span class="text">
            <span class="name">配色</span>
            <span class="desc">メインカラーから、補色や類似色などの配色を作る。</span>
          </span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
